<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.E.SNO Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

body {
  background-image: url("IMG20260922-WA0005.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
}

.content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 0 10px 7vh;
  text-align: center;
}

.title {
  color: white;
  font-size: clamp(25px, 6vw, 50px);
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 15px;
  text-shadow: 0 3px 10px #000;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.box {
  min-width: 21vw;
  padding: 10px 5px;
  background: rgba(0,0,0,0.85);
  border: 2px solid #d4af37;
  border-radius: 8px;
}

.number {
  color: white;
  font-size: clamp(28px, 8vw, 70px);
  font-weight: bold;
}

.label {
  color: #d4af37;
  font-size: clamp(8px, 2.5vw, 14px);
  font-weight: bold;
  margin-top: 5px;
}

.message {
  display: none;
  color: white;
  font-size: clamp(28px, 8vw, 60px);
  font-weight: bold;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

  <div class="title">COUNTDOWN</div>

  <div class="countdown" id="countdown">

    <div class="box">
      <div class="number" id="days">00</div>
      <div class="label">DAGEN</div>
    </div>

    <div class="box">
      <div class="number" id="hours">00</div>
      <div class="label">UREN</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">00</div>
      <div class="label">MINUTEN</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">00</div>
      <div class="label">SECONDEN</div>
    </div>

  </div>

  <div class="message" id="message">
    HET IS ZOVER!
  </div>

</div>

<script>

const eindDatum = new Date("2026-09-25T00:00:00+02:00").getTime();

function updateCountdown() {

  const nu = new Date().getTime();
  const verschil = eindDatum - nu;

  if (verschil <= 0) {
    document.getElementById("countdown").style.display = "none";
    document.getElementById("message").style.display = "block";
    return;
  }

  const dagen = Math.floor(verschil / (1000 * 60 * 60 * 24));

  const uren = Math.floor(
    (verschil % (1000 * 60 * 60 * 24)) /
    (1000 * 60 * 60)
  );

  const minuten = Math.floor(
    (verschil % (1000 * 60 * 60)) /
    (1000 * 60)
  );

  const seconden = Math.floor(
    (verschil % (1000 * 60)) /
    1000
  );

  document.getElementById("days").textContent =
    String(dagen).padStart(2, "0");

  document.getElementById("hours").textContent =
    String(uren).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minuten).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconden).padStart(2, "0");
}

updateCountdown();

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
